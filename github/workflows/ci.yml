name: Run API Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'   # caches ~/.m2 between runs, speeds things up a lot

      - name: Run TestNG suite via Maven
        run: mvn -B clean test
        # If you invoke a specific testng.xml via surefire, this already picks it up
        # from your pom.xml <suiteXmlFiles> config. Otherwise you can do:
        # run: mvn -B clean test -DsuiteXmlFile=testng.xml

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()   # run even if tests fail, so you can see results
        with:
          name: TestNG Results
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit

      - name: Upload surefire reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
