name: Run API Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'   # caches ~/.m2 between runs, speeds things up a lot

      - name: Write config.properties from secrets
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/config.properties <<EOF
          base.url=${{ secrets.CONFIG_BASE_URL }}
          access.token=${{ secrets.CONFIG_ACCESS_TOKEN }}
          test.customer.id=${{ secrets.CONFIG_TEST_CUSTOMER_ID }}
          payment.id=${{ secrets.CONFIG_PAYMENT_ID }}
          payment.method=${{ secrets.CONFIG_PAYMENT_METHOD }}
          payment.method.id=${{ secrets.CONFIG_PAYMENT_METHOD_ID }}
          default.medicine.name=${{ secrets.CONFIG_DEFAULT_MEDICINE_NAME }}
          default.product.code=${{ secrets.CONFIG_DEFAULT_PRODUCT_CODE }}
          default.pincode=${{ secrets.CONFIG_DEFAULT_PINCODE }}
          default.address.id=${{ secrets.CONFIG_DEFAULT_ADDRESS_ID }}
          version.name=${{ secrets.CONFIG_VERSION_NAME }}
          EOF

      - name: Run TestNG suite via Maven
        run: mvn -B clean test
        # If you invoke a specific testng.xml via surefire, this already picks it up
        # from your pom.xml <suiteXmlFiles> config. Otherwise you can do:
        # run: mvn -B clean test -DsuiteXmlFile=testng.xml

      - name: Publish test report (pass/fail summary on the run)
        uses: dorny/test-reporter@v1
        if: always()   # run even if tests fail, so you can see results
        with:
          name: TestNG Results
          path: 'target/surefire-reports/TEST-*.xml'
          reporter: java-junit

      - name: Upload surefire reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload ExtentReports HTML as artifact
        if: always()   # capture the report even if tests failed
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: test-output/ExtentReport.html
